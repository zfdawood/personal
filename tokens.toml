# ── Warm Terminal / Cozy Archive — design tokens ────────────────────────────
# The single source of truth for every color on the desktop. After editing:
#     make install  # regenerate configs/, deploy, reload running apps
#     make check    # contrast + "generated files are up to date"
#
# Three layers, each referring only to the one above it:
#   [swatch]        raw paint, named for what it looks like
#   [roles.*]       what a color is FOR in the UI (bar, notifications, borders)
#   [terminal.*]    kitty chrome + the 16 ANSI colors
# Each of roles/terminal has a light and a dark set; every app ships both, and
# the settings menu (SUPER+comma) switches between them at runtime. `mode` is
# applied on every `make install` / `make colors`, overriding the menu's choice. Values below the swatch layer are
# swatch names; a literal "#RRGGBB" also works.

# ── Default mode ────────────────────────────────────────────────────────────
mode = "light"      # "light" (day archive) | "dark" (night archive)

[swatch]
# Neutrals, light → dark
parchment_hi   = "#FBF6EC"
parchment      = "#F3E9D8"
parchment_deep = "#E3D5B8"
vellum         = "#D9CBB0"
straw          = "#C9B896"
leather        = "#8A7654"
leather_ink    = "#776649"   # leather darkened to pass 4.5:1 on parchment
leather_glow   = "#A18A64"   # leather lightened to pass 4.5:1 on umber
walnut         = "#5C4A2E"
umber_line     = "#4A3F35"
umber          = "#2B2420"
umber_deep     = "#1C1713"
black          = "#000000"

# The desk the papers lie on. Measured in OKLab lightness (see contrast.py):
# a desk must sit visibly below the paper, and a card's shadow below the desk.
oak            = "#B39C78"   # day desk        (paper − desk ΔL ≈ 0.23)
oak_shade      = "#7A6646"   # day card shadow (desk − shadow ΔL ≈ 0.18)
ebony          = "#120E0B"   # night desk      (paper − desk ΔL ≈ 0.10)

# Light comes from the top left (the shadows fall down-right), so edges have a
# lit side (top/left) and a shaded side (bottom/right).
straw_shade    = "#B9A684"   # straw on its shaded side
umber_mid      = "#3A3129"   # just above umber: night's lit lip and shaded edge

# Accents. The plain name is the "fill" — mid-brightness, for meters, borders,
# and anything that isn't text. `_ink` is the same hue darkened until it reads
# as text on parchment (~5.2:1); `_ink_bright` is more saturated at ~4.6:1.
# `_glow` is the hue lightened to read on umber (~5.5:1); `_glow_bright` is
# lighter still (~7.5:1) — on a dark background "bright" can just mean lighter.
amber            = "#C97B3D"
amber_edge       = "#B0642A"   # amber deepened to 3:1 on parchment (focus border)
amber_ink        = "#8A5327"
amber_ink_bright = "#A05419"
rose             = "#B5654F"
rose_ink         = "#904E3D"
rose_ink_bright  = "#A84D34"
moss             = "#7C8B6F"
moss_ink         = "#59634F"
moss_ink_bright  = "#5E6D52"
slate_ink        = "#56626B"
slate_ink_bright = "#596A78"
mauve_ink        = "#7E5656"
mauve_ink_bright = "#935858"
teal_ink         = "#50645F"
teal_ink_bright  = "#526E67"

amber_glow         = "#D08C57"
amber_glow_bright  = "#E3AB7D"
rose_glow          = "#C88E7D"
rose_glow_bright   = "#DCAB9D"
moss_glow          = "#93A087"
moss_glow_bright   = "#AEBAA5"
slate_glow         = "#919DA7"
slate_glow_bright  = "#ADB8C0"
mauve_glow         = "#B69393"
mauve_glow_bright  = "#CCB0B0"
teal_glow          = "#89A19B"
teal_glow_bright   = "#A6BBB5"

# Brand inks, from the printed handout (the web pages' accents). `_glow` is the
# night version, lightened to read on umber.
gel        = "#5A3D94"   # purple: numbers, dates, asks, quotes
gel_glow   = "#BBA5E8"
pink       = "#AD3A6C"   # marks, links, focus
pink_ink   = "#8A2D56"   # pink deepened: the focused edge's shaded side
pink_glow  = "#E58BB0"
pink_dusk  = "#BF4A7E"   # between pink and pink_glow: night's shaded focus edge (3.3:1 on umber)
hl         = "#E280A6"   # the highlighter, used at 24%

# ── Roles: "day archive" ────────────────────────────────────────────────────
[roles.light]
bgPrimary     = "parchment"
bgAlt         = "parchment_deep"   # recesses, meter tracks
border        = "straw"            # hairlines, inactive borders
borderStrong  = "leather"          # inactive window borders (Hyprland)
textPrimary   = "umber"
textSecondary = "walnut"           # labels
textTertiary  = "leather"          # inactive states only (not checked as text)
accent        = "gel"              # fills: meters (the web's purple ink)
warning       = "rose"
alert         = "rose_ink"         # warning as text: login errors
good          = "moss"
media         = "rose"             # volume meter
accentSolid   = "gel"              # a filled accent surface that carries text…
onAccentSolid = "parchment"        # …and the text on it
scanline      = "black"
desk          = "oak"              # desktop background: papers lie on it
shadow        = "oak_shade"        # hard offset shadow under windows and the bar
focusBorder      = "pink"          # focused window's edge, lit side (the web's focus pink)
focusBorderShade = "pink_ink"      # …its shaded side; both ends pass 3:1
borderShade      = "straw_shade"   # unfocused edges, shaded side (`border` is the lit side)
highlight        = "parchment_hi"  # 1px lit lip inside a card's top/left edge
pencil           = "gel"           # pencilled text in the hand face (the clock)

# ── Roles: "night archive" ──────────────────────────────────────────────────
[roles.dark]
bgPrimary     = "umber"
bgAlt         = "umber_deep"
border        = "umber_line"
borderStrong  = "leather"
textPrimary   = "parchment"
textSecondary = "straw"
textTertiary  = "leather"
accent        = "gel_glow"
warning       = "rose"
alert         = "rose_glow"
good          = "moss"
media         = "rose"
accentSolid   = "gel_glow"
onAccentSolid = "umber"
scanline      = "black"
desk          = "ebony"
shadow        = "black"
focusBorder      = "pink_glow"     # lit side: lighter on a dark card
focusBorderShade = "pink_dusk"
borderShade      = "umber_mid"
highlight        = "umber_mid"
pencil           = "gel_glow"

# ── Terminal (kitty) ────────────────────────────────────────────────────────
# ANSI semantics are kept in both modes: black is dark and white is light.
# Day: normal text uses `foreground`; programs that ask for "white" draw it on
# black (inverse video, TUIs), so white is checked against color0 rather than
# the parchment. Night: the mirror image — white is text, black is exempt.
[terminal.light]
background              = "parchment"
foreground              = "umber"
cursor                  = "pink"
cursor_text_color       = "parchment"
selection_background    = "parchment_deep"
selection_foreground    = "umber"
active_border_color     = "pink"
inactive_border_color   = "straw"
active_tab_background   = "gel"
active_tab_foreground   = "parchment"
inactive_tab_background = "parchment_deep"
inactive_tab_foreground = "walnut"

color0  = "umber"             # black
color8  = "leather_ink"       # bright black — dim text (comments, autosuggestions)
color1  = "rose_ink"          # red
color9  = "rose_ink_bright"
color2  = "moss_ink"          # green
color10 = "moss_ink_bright"
color3  = "amber_ink"         # yellow
color11 = "amber_ink_bright"
color4  = "slate_ink"         # blue
color12 = "slate_ink_bright"
color5  = "mauve_ink"         # magenta
color13 = "mauve_ink_bright"
color6  = "teal_ink"          # cyan
color14 = "teal_ink_bright"
color7  = "vellum"            # white
color15 = "parchment_hi"      # bright white

[terminal.dark]
background              = "umber"
foreground              = "parchment"
cursor                  = "pink_glow"
cursor_text_color       = "umber"
selection_background    = "umber_line"
selection_foreground    = "parchment"
active_border_color     = "pink_glow"
inactive_border_color   = "umber_line"
active_tab_background   = "gel_glow"
active_tab_foreground   = "umber"
inactive_tab_background = "umber_deep"
inactive_tab_foreground = "straw"

color0  = "umber_line"        # black — a step above the background, so "black" blocks show
color8  = "leather_glow"      # bright black — dim text
color1  = "rose_glow"         # red
color9  = "rose_glow_bright"
color2  = "moss_glow"         # green
color10 = "moss_glow_bright"
color3  = "amber_glow"        # yellow
color11 = "amber_glow_bright"
color4  = "slate_glow"        # blue
color12 = "slate_glow_bright"
color5  = "mauve_glow"        # magenta
color13 = "mauve_glow_bright"
color6  = "teal_glow"         # cyan
color14 = "teal_glow_bright"
color7  = "straw"             # white
color15 = "parchment_hi"      # bright white

# ── Wallpaper (tools/wallpaper.py) ──────────────────────────────────────────
# Each material is a ramp of swatches, darkest → lightest. The generator shades
# in continuous values, then dithers each pixel to its OWN material's ramp only
# (so dark wood never picks up stray greens). Light comes from the top left.
[wallpaper.light]
wood  = ["walnut", "oak_shade", "leather", "oak", "straw"]
seam  = ["walnut"]                          # board gaps
stem  = ["moss_ink", "moss_ink_bright", "moss"]
leaf  = ["moss_ink", "moss", "moss_glow", "moss_glow_bright"]
berry = ["rose_ink", "rose", "amber"]
nail  = ["walnut", "leather", "straw"]

[wallpaper.dark]
wood  = ["black", "ebony", "umber_deep", "umber", "umber_line"]
seam  = ["black"]
stem  = ["teal_ink", "moss_ink", "moss_ink_bright"]
leaf  = ["umber_line", "teal_ink", "moss_ink", "moss"]
berry = ["rose_ink", "mauve_ink", "amber_ink"]
nail  = ["black", "umber_line", "leather"]

# ── Structure: shared by the desktop and the web ───────────────────────────
# Everything on screen is sized in whole units. Tokens.qml carries unit and cut
# to Theme.qml; brand.css carries all of these to the web.
[structure]
unit       = 4        # px. The one spacing unit
cut        = 2        # units. Corners are cut at 45°, this far in
shadow     = 1        # units. The hard shadow, down-right, no blur
bevel      = 3        # px. Width of the web sheet's flat-shaded bevel
page       = 1200     # px. The widest a web sheet gets
desk_seed  = 7        # wallpaper seed for the web desk
desk_size  = "320x200"
desk_scale = 4        # the desk is shown at exactly this scale: one pixel = one unit

# ── Type (web and desktop) ──────────────────────────────────────────────────
# Only top-level headings are mono; dates and item numbers are pencilled in.
# The desktop uses the first family of each stack: mono for the bar, menus and
# kitty, hand for the clock, text for notifications. `make fonts` installs them.
[type]
text = '"Newsreader", "Iowan Old Style", Charter, Georgia, serif'
head = '"Archivo", "Arial Narrow", system-ui, sans-serif'
mono = '"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace'
hand = '"Kalam", "Segoe Print", "Bradley Hand", cursive'
google_fonts = "https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;600;700&family=Kalam:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap"

# ── Web: a sheet of paper on the desk ───────────────────────────────────────
# brand.css's custom properties (camelCase here, kebab-case there). The bevel's
# eight faces are computed from `lit` and `ruleShade` by the same Lambert rule
# as Card.qml, so they are not listed.
[web.light]
desk      = "oak"
shadow    = "oak_shade"
sheet     = "parchment"
recess    = "parchment_deep"  # chips, wells, the footer label
lit       = "parchment_hi"    # the bevel's lit end
rule      = "straw"
ruleShade = "straw_shade"     # the bevel's shaded end, chip edges
ink       = "umber"
muted     = "walnut"
faint     = "leather_ink"
gel       = "gel"
pink      = "pink"
good      = "moss_ink"

[web.dark]
desk      = "ebony"
shadow    = "black"
sheet     = "umber"
recess    = "umber_deep"
lit       = "umber_mid"
rule      = "umber_line"
ruleShade = "umber_deep"      # not borderShade: the web bevel needs a step below umber_mid
ink       = "parchment"
muted     = "straw"
faint     = "leather_glow"
gel       = "gel_glow"
pink      = "pink_glow"
good      = "moss_glow"         # moss alone is 4.2:1 on umber; text needs 4.5

# Translucent web colors: [swatch, alpha].
[web_alpha.light]
hl     = ["hl", 0.24]         # the highlighter swipe
margin = ["pink", 0.45]       # the margin rule

[web_alpha.dark]
hl     = ["pink_glow", 0.20]
margin = ["pink_glow", 0.35]

# ── Editors (Zed, VS Code) ──────────────────────────────────────────────────
[editor.light]
background    = "parchment"
surface       = "parchment_deep"   # sidebars, panels, tabs
chrome        = "vellum"           # title and status bars
border        = "straw"
text          = "umber"
textMuted     = "walnut"
textFaint     = "leather_ink"      # line numbers, placeholders
accent        = "pink"             # focus borders, links
accentSolid   = "gel"              # buttons, badges, the active tab's mark…
onAccentSolid = "parchment"        # …and the text on them
selection     = "vellum"
lineHighlight = "parchment_hi"
cursor        = "amber_ink"
error         = "rose_ink"
warning       = "amber_ink"
success       = "moss_ink"
info          = "slate_ink"

[editor.dark]
background    = "umber"
surface       = "umber_deep"
chrome        = "umber_deep"
border        = "umber_line"
text          = "parchment"
textMuted     = "straw"
textFaint     = "leather_glow"
accent        = "pink_glow"
accentSolid   = "gel_glow"
onAccentSolid = "umber"
selection     = "umber_line"
lineHighlight = "umber_mid"
cursor        = "amber"
error         = "rose_glow"
warning       = "amber_glow"
success       = "moss_glow"
info          = "slate_glow"

# Code colors, as text on editor.background. The brand's purple is the keyword.
[syntax.light]
comment     = "leather_ink"
keyword     = "gel"
string      = "moss_ink"
number      = "amber_ink"
constant    = "amber_ink"
function    = "slate_ink"
type        = "teal_ink"
tag         = "rose_ink"
attribute   = "amber_ink_bright"
property    = "mauve_ink"
variable    = "umber"
operator    = "walnut"
punctuation = "walnut"

[syntax.dark]
comment     = "leather_glow"
keyword     = "gel_glow"
string      = "moss_glow"
number      = "amber_glow"
constant    = "amber_glow"
function    = "slate_glow"
type        = "teal_glow"
tag         = "rose_glow"
attribute   = "amber_glow_bright"
property    = "mauve_glow"
variable    = "parchment"
operator    = "straw"
punctuation = "straw"

# ── Glyphs ──────────────────────────────────────────────────────────────────
# Ramps for the low-poly glyphs, darkest → lightest (the wallpaper's greens).
# One set for both modes: the mid-tone greens read on parchment and on umber.
[glyph]
leaf = ["moss_ink", "moss_ink_bright", "moss", "moss_glow", "moss_glow_bright"]
stem = ["moss_ink", "moss_ink_bright", "moss"]
