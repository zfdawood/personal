<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;600;700&family=Kalam:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet">
<style>
{{BRAND_CSS}}

/* ── Agenda ─────────────────────────────────────────────────────────────── */
/* Agendas are the business variant of the brand: the palette, mono headings, cut corners and the
   hard shadow stay; the decoration goes. No desk wallpaper (render.py strips it from brand.css), no
   day/night switch (they follow the system's mode), no paper grain, margin rule, bevel or
   handwriting. */
body::before { content: none; }
.sheet { background-image: none; box-shadow: inset 0 0 0 1px var(--rule-shade); padding-left: calc(10 * var(--u)); }
.sheet::before { content: none; }
.readout { margin-bottom: calc(5 * var(--u)); }
.byline { font-size: 15.5px; }
.byline .when { font: inherit; color: var(--muted); }
/* The bar above the list: the item count, and expand/collapse. */
.bar { display: flex; justify-content: flex-end; align-items: center; gap: calc(3 * var(--u)); margin: calc(8 * var(--u)) 0 0; padding-bottom: calc(2 * var(--u)); border-bottom: 2px solid var(--ink); }
.bar span { font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Items: the one-liner is the summary; the detail folds out under it. */
ol.agenda { list-style: none; margin: 0; padding: 0; counter-reset: n; }
ol.agenda > li { counter-increment: n; border-bottom: 1px solid var(--rule); }
ol.agenda summary { display: grid; grid-template-columns: calc(7 * var(--u)) minmax(0, 1fr) auto; gap: calc(3 * var(--u)); align-items: baseline; padding: calc(3 * var(--u)) 0; }
ol.agenda details[open] > summary { padding-bottom: calc(2 * var(--u)); }
summary .n { font: 600 14px/1.3 var(--mono); color: var(--gel); text-align: right; }
summary .n::before { content: counter(n) "."; }
summary .line { min-width: 0; }
summary .topic { font: 700 15.5px/1.3 var(--mono); letter-spacing: -0.01em; }
summary:hover .topic { color: var(--pink); }
.body { padding: 0 0 calc(5 * var(--u)) calc(10 * var(--u)); }
.body p, .body ul { max-width: 96ch; }
.body p { margin: 0 0 calc(2 * var(--u)); }
.body ul { margin: 0 0 calc(2 * var(--u)); padding-left: calc(5 * var(--u)); }
.body li { margin: var(--u) 0; }
.body li::marker { color: var(--faint); }
.body h4:first-child { margin-top: 0; }

/* Presentation aids (aids.py): diagrams and screenshots inside a fold-out, in the page's tokens. */
figure.aid { margin: calc(3 * var(--u)) 0 calc(4 * var(--u)); max-width: 100%; }
figure.aid svg { display: block; width: 100%; height: auto; overflow: visible; }
figure.aid figcaption { margin-top: calc(2 * var(--u)); font: 400 12px/1.5 var(--mono); color: var(--faint); }
figure.aid.shot img { display: block; max-width: 100%; height: auto; border: 1px solid var(--rule-shade); }
.aid-box { fill: var(--recess); stroke: var(--rule-shade); stroke-width: 1; }
.aid-base { fill: none; stroke-dasharray: 4 3; }
.aid-title { font: 600 14px var(--mono); fill: var(--ink); }
.aid-detail { font: 400 14px var(--text); fill: var(--muted); }
.aid-arrow { stroke: var(--faint); stroke-width: 1.5; fill: none; }
.aid-head { fill: var(--faint); }
.aid-seg.aid-good { fill: var(--good); }
.aid-seg.aid-ask { fill: var(--gel); }
.aid-seg.aid-bad { fill: var(--pink); }
.aid-seg.aid-plain { fill: var(--rule-shade); }

@media (max-width: 640px) {
  ol.agenda summary { grid-template-columns: calc(6 * var(--u)) minmax(0, 1fr) auto; gap: calc(2 * var(--u)); }
  .sheet { padding-left: calc(5 * var(--u)); }
  .body { padding-left: calc(8 * var(--u)); }
}
@media (prefers-reduced-motion: no-preference) { details[open] > .body { animation: unfold .18s ease-out; } }
@keyframes unfold { from { opacity: .4; transform: translateY(-2px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="paper"><article class="sheet">
{{BODY}}
</article></div>
{{FOOTER}}

<script>
  // Expand/collapse every item. Agendas open collapsed so the page reads as the short list.
  (function () {
    var btn = document.querySelector("button.toggle-all");
    if (!btn) return;
    var items = Array.prototype.slice.call(document.querySelectorAll("ol.agenda details"));
    function sync() { btn.textContent = items.every(function (d) { return d.open; }) ? "Collapse all" : "Expand all"; }
    btn.addEventListener("click", function () {
      var open = !items.every(function (d) { return d.open; });
      items.forEach(function (d) { d.open = open; });
      sync();
    });
    items.forEach(function (d) { d.addEventListener("toggle", sync); });
    window.addEventListener("beforeprint", function () { items.forEach(function (d) { d.open = true; }); });
  })();
</script>
</body>
</html>
