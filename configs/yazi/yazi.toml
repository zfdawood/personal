# ── Cozy Archive — yazi (SUPER+E) ──────────────────────────────────────────
# Hand-written. Colors live in theme.toml, which apply.py links to the
# generated theme-light.toml / theme-dark.toml.
# Text first, like `ls -F`: one-character markers (/ @ * !), no icon font.

[mgr]
ratio          = [1, 3, 4]     # parent, current, preview
sort_by        = "natural"
sort_dir_first = true
show_hidden    = false         # `.` toggles
show_symlink   = true
linemode       = "size"        # `m` then s/m/p… changes it
scrolloff      = 4
title_format   = "yazi: {cwd}"

[preview]
wrap       = "no"
tab_size   = 4
max_width  = 1200
max_height = 1800
