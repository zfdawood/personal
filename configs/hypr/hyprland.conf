# ── Warm Terminal / Cozy Archive — Hyprland ─────────────────────────────────
# Square, thick-bordered, no rounding. Rust-amber active edge on deep-parchment.
# Colors mirror Theme.qml; keep them in sync if you tweak the palette.

# Palette (0xAARRGGBB)
$amber  = 0xffc97b3d   # rust amber — active border / focus
$leather = 0xff8a7654  # worn leather — inactive border
$parchment = 0xfff3e9d8

# ── Monitors ────────────────────────────────────────────────────────────────
# `preferred` auto-detects; edit for a real machine (e.g. DP-1,2560x1440@144,0x0,1).
monitor = ,preferred,auto,1

# ── Autostart ───────────────────────────────────────────────────────────────
exec-once = hyprpaper
exec-once = quickshell
exec-once = mako

# ── Look & feel ─────────────────────────────────────────────────────────────
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = $amber
    col.inactive_border = $leather
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 0            # square corners everywhere
    # Restraint: no blur, minimal shadow — physical equipment, not glass.
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
    active_opacity = 1.0
    inactive_opacity = 1.0
}

animations {
    enabled = true
    # Snappy, mechanical — nothing bouncy.
    bezier = crisp, 0.2, 0.0, 0.2, 1.0
    animation = windows, 1, 3, crisp
    animation = fade, 1, 3, crisp
    animation = workspaces, 1, 3, crisp, slide
    animation = border, 1, 4, crisp
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = $parchment
}

# ── Input ───────────────────────────────────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

# ── Keybinds ────────────────────────────────────────────────────────────────
$mod = SUPER
$term = kitty

bind = $mod, Return, exec, $term
bind = $mod, Q, killactive,
bind = $mod, M, exit,
bind = $mod, E, exec, nautilus
bind = $mod, V, togglefloating,
bind = $mod, F, fullscreen,
bind = $mod, Space, exec, wofi --show drun

# Focus (vim + arrows)
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# Workspaces 1–5 (match the bar's numbered squares)
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Mouse drag move/resize
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
