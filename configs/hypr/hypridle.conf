# ── Cozy Archive — hypridle ────────────────────────────────────────────────
# Every lock goes through logind (`loginctl lock-session`, which SUPER+L
# also runs), and logind's lock signal shows Quickshell's lock card (Lock.qml).
# Locking before sleep means the machine never wakes up unlocked.

general {
    lock_cmd         = quickshell ipc call lock lock
    before_sleep_cmd = loginctl lock-session
    ignore_dbus_inhibit = false        # a playing video keeps the screen awake
}

# Ten minutes idle: lock.
listener {
    timeout    = 600
    on-timeout = loginctl lock-session
}
