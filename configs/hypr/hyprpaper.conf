# Solid parchment background — no wallpaper image, keeps the "warm paper desk" base.
# Swap in an image later if you like: preload = ~/path.png  /  wallpaper = ,~/path.png
splash = false
ipc = off

# hyprpaper doesn't paint solid colors itself; Hyprland's misc:background_color
# handles the base. This file is here so `exec-once = hyprpaper` has a config
# to load once you add a real wallpaper.
