# ── Warm Terminal / Cozy Archive — kitty (day archive / light) ──────────────
# kitty takes one family (a second font_family line would override this one);
# if Departure Mono isn't installed it falls back to fontconfig's monospace.
font_family      Departure Mono
font_size        12.0
adjust_line_height 110%

# Square, thin-bordered, restrained.
window_padding_width 8
window_border_width  1pt
cursor_shape         block
cursor_blink_interval 0
scrollback_lines     10000
enable_audio_bell    no
confirm_os_window_close 0

# ── Palette ─────────────────────────────────────────────────────────────────
# Text colors are checked by `make check` (tools/contrast.py): every color a
# program might print as text must reach WCAG 4.5:1 on the background. The
# accents are Theme.qml's hues darkened until they pass; the bar keeps the
# lighter originals, since meter fills aren't text.
background   #F3E9D8
foreground   #2B2420
cursor       #8A5327
cursor_text_color #F3E9D8

selection_background #E3D5B8
selection_foreground #2B2420

active_border_color   #C97B3D
inactive_border_color #C9B896

active_tab_background   #8A5327
active_tab_foreground   #F3E9D8
inactive_tab_background #E3D5B8
inactive_tab_foreground #5C4A2E

# ANSI semantics are kept: black is dark, white is light. Programs that want
# normal text use the default foreground; the ones that ask for "white" are
# almost always drawing it on a black background (inverse video, TUIs), so
# white is tuned against color0, not against the parchment.
# Normal = accent darkened to ~5.2:1; bright = same hue, more saturated, ~4.6:1.

# black / bright black (dim text: comments, autosuggestions)
color0  #2B2420
color8  #776649
# red (dusty rose)
color1  #904E3D
color9  #A84D34
# green (sage moss)
color2  #59634F
color10 #5E6D52
# yellow (rust amber)
color3  #8A5327
color11 #A05419
# blue (warm-neutral slate)
color4  #56626B
color12 #596A78
# magenta (muted rose-brown)
color5  #7E5656
color13 #935858
# cyan (muted teal-sage)
color6  #50645F
color14 #526E67
# white / bright white (light — used on dark backgrounds)
color7  #D9CBB0
color15 #FBF6EC
