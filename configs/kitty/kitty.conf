# ── Warm Terminal / Cozy Archive — kitty (day archive / light) ──────────────
# The brand's mono (tokens.toml [type] mono; `make fonts` installs it). kitty
# takes one family; if it's missing, fontconfig's monospace stands in.
font_family      JetBrains Mono
font_size        11.0
adjust_line_height 110%

# Square, thin-bordered, restrained.
window_padding_width 8
window_border_width  1pt
cursor_shape         block
cursor_blink_interval 0
scrollback_lines     10000
enable_audio_bell    no
confirm_os_window_close 0

# ── Palette ─────────────────────────────────────────────────────────────────
# Generated from tokens.toml [terminal] — edit there, then `make`.
include colors.conf
# colors.conf sets background_opacity (tokens.toml alpha); kitty applies a new
# one on reload only if this was on when it started.
dynamic_background_opacity yes
