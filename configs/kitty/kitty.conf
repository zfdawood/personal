# ── Warm Terminal / Cozy Archive — kitty (day archive / light) ──────────────
# kitty takes one family (a second font_family line would override this one);
# if Departure Mono isn't installed it falls back to fontconfig's monospace.
font_family      Departure Mono
font_size        12.0
adjust_line_height 110%

# Square, thin-bordered, restrained.
window_padding_width 8
window_border_width  1pt
cursor_shape         block
cursor_blink_interval 0
scrollback_lines     10000
enable_audio_bell    no
confirm_os_window_close 0

# ── Palette ─────────────────────────────────────────────────────────────────
# Generated from tokens.toml [terminal] — edit there, then `make`.
include colors.conf
